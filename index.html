<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Sidebar — Law Week Edition 2026 | LAWSAN NDU</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Montserrat', sans-serif;
    }

    /* ─────────────────────────────────────────
       VIEWER — one page at a time, full screen
    ───────────────────────────────────────── */
    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Each page sits in the same spot; only .active is visible */
    .page {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .page.active {
      display: flex;
    }

    /* Blurred background — same image, stretched + blurred to fill side bars */
    .page-blur {
      position: absolute;
      inset: -40px; /* slightly larger to cover blur edges */
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.55) saturate(1.3);
      z-index: 0;
    }

    /* Actual image sits on top, fully intact, no cropping */
    .page img {
      position: relative;
      z-index: 1;
      max-width:  100vw;
      max-height: calc(100vh - 50px);
      width:  auto;
      height: auto;
      display: block;
      object-fit: contain;
      /* subtle shadow to separate image from blurred bg */
      box-shadow: 0 0 60px rgba(0,0,0,0.6);
    }

    /* Coming soon page — no image, just dark */
    .page-placeholder {
      background: #060306;
    }
    .page-placeholder .page-blur { display: none; }

    /*
      THE GOLDEN RULE:
      The image is shown exactly as uploaded.
      • It fits entirely within the screen (no cropping, no stretching).
      • Black/dark bars may appear on sides or top/bottom — that is correct
        behaviour when a portrait image is viewed on a landscape screen,
        just like a PDF viewer or photo app.
      • Nothing else is overlaid on the image itself.
    */
    .page img {
      max-width:  100vw;
      max-height: calc(100vh - 50px); /* leave room for nav bar */
      width:  auto;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* ─────────────────────────────────────────
       TOP NAVIGATION BAR
    ───────────────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,164,78,0.25);
    }

    .topbar-brand {
      display: flex; flex-direction: column; line-height: 1.1;
    }
    .topbar-brand span:first-child {
      font-family: 'Playfair Display', serif;
      font-size: 0.82rem; letter-spacing: 0.15em; color: #C9A44E;
    }
    .topbar-brand span:last-child {
      font-size: 0.4rem; letter-spacing: 0.25em;
      text-transform: uppercase; color: rgba(201,164,78,0.45);
    }

    .topbar-dots {
      display: flex; gap: 7px; align-items: center;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(201,164,78,0.3);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .dot.active {
      background: #C9A44E; border-color: #C9A44E; transform: scale(1.4);
    }

    .topbar-counter {
      font-size: 0.6rem; letter-spacing: 0.12em;
      color: rgba(201,164,78,0.55); min-width: 32px; text-align: right;
    }

    /* ─────────────────────────────────────────
       LEFT / RIGHT ARROWS
    ───────────────────────────────────────── */
    .arrow {
      position: fixed; top: 50%; transform: translateY(-50%);
      z-index: 999;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(201,164,78,0.35);
      color: #C9A44E; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .2s, transform .2s;
      user-select: none;
    }
    .arrow:hover { background: rgba(201,164,78,0.2); transform: translateY(-50%) scale(1.1); }
    .arrow.off   { opacity: 0; pointer-events: none; }
    .arrow-prev  { left: 12px; }
    .arrow-next  { right: 12px; }

    /* ─────────────────────────────────────────
       PAGE TURN ANIMATION
    ───────────────────────────────────────── */
    @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
    .fade-in  { animation: fadeIn  .35s ease forwards; }
    .fade-out { animation: fadeOut .35s ease forwards; }

    /* ─────────────────────────────────────────
       COMING SOON PLACEHOLDER PAGE
    ───────────────────────────────────────── */
    .page-placeholder {
      flex-direction: column; gap: 1.2rem;
      text-align: center; padding: 2rem;
    }
    .placeholder-rule {
      width: 160px; height: 1px;
      background: linear-gradient(to right, transparent, #C9A44E, transparent);
    }
    .placeholder-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem,3.5vw,2rem); color: #C9A44E; font-weight: 700;
    }
    .placeholder-sub {
      font-size: 0.7rem; letter-spacing: 0.08em;
      color: rgba(201,164,78,0.45); max-width: 340px; line-height: 1.6;
    }
    .placeholder-tags {
      display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
    }
    .placeholder-tag {
      font-size: 0.5rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: rgba(201,164,78,0.4);
      border: 1px solid rgba(201,164,78,0.18); padding: .28rem .7rem; border-radius: 2px;
    }

    /* mobile */
    @media (max-width: 540px) {
      .arrow { width: 34px; height: 34px; font-size: .85rem; }
      .arrow-prev { left: 6px; } .arrow-next { right: 6px; }
    }
  </style>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<nav class="topbar">
  <div class="topbar-brand">
    <span>THE SIDEBAR</span>
    <span>Law Week Edition 2026</span>
  </div>
  <div class="topbar-dots" id="dots"></div>
  <span class="topbar-counter" id="counter">1 / 5</span>
</nav>

<!-- ══ ARROWS ══ -->
<button class="arrow arrow-prev off" id="prev" aria-label="Previous">&#8592;</button>
<button class="arrow arrow-next"     id="next" aria-label="Next">&#8594;</button>

<!-- ══ PAGES ══
     Rule: one <div class="page"> per image.
     The image is NEVER cropped or altered — it is displayed exactly as uploaded.
     To add more pages, duplicate the pattern below and point src at the new image.
-->
<main class="viewer">

  <div class="page active" data-label="Cover">

    <img src="assets/images/president.jpg.png" alt="President's Remarks" />

  <div class="page" data-label="Law Week Dress Code · 12th–17th October">

  </div>

  <div class="page" data-label="Day 1 · Law Week 2026">
    <div class="page-blur" style="background-image:url('assets/images/day1.jpg.jpeg')"></div>
    <img src="assets/images/day1.jpg.jpeg" alt="Day 1 — Law Week 2026" />
  </div>

  <div class="page" data-label="Day 2 · Law Week 2026">
    <div class="page-blur" style="background-image:url('assets/images/day2.jpg.jpeg')"></div>
    <img src="assets/images/day2.jpg.jpeg" alt="Day 2 — Law Week 2026" />
  </div>

  <div class="page" data-label="Day 3 · Law Week 2026">
    <div class="page-blur" style="background-image:url('assets/images/day3.jpg.jpeg')"></div>
    <img src="assets/images/day3.jpg.jpeg" alt="Day 3 — Law Week 2026" />
  </div>

  <div class="page" data-label="Day 4 · Law Week 2026">
    <div class="page-blur" style="background-image:url('assets/images/day4.jpg.jpeg')"></div>
    <img src="assets/images/day4.jpg.jpeg" alt="Day 4 — Law Week 2026" />
  </div>

  <div class="page" data-label="Interview with the President · Part 1">

  <div class="page" data-label="Biography · Chief Somina Johnbull, SAN">

  <!-- PLACEHOLDER — remove this div once more images are uploaded -->
  <div class="page page-placeholder" data-label="More pages coming soon…">

      <span class="placeholder-tag">Executive Council</span>

    </div>
    <div class="placeholder-rule"></div>
  </div>

</main>

<script>
(function () {
  const pages = [...document.querySelectorAll('.viewer .page')];
  const total = pages.length;
  const dotsEl   = document.getElementById('dots');
  const counterEl = document.getElementById('counter');
  const prevBtn  = document.getElementById('prev');
  const nextBtn  = document.getElementById('next');
  let cur = 0, busy = false;

  /* Build dots */
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => go(i));
    dotsEl.appendChild(d);
  });

  function allDots() { return [...dotsEl.querySelectorAll('.dot')]; }

  function refresh() {
    counterEl.textContent = `${cur + 1} / ${total}`;
    allDots().forEach((d, i) => d.classList.toggle('active', i === cur));
    prevBtn.classList.toggle('off', cur === 0);
    nextBtn.classList.toggle('off', cur === total - 1);
  }

  function go(next) {
    if (busy || next === cur || next < 0 || next >= total) return;
    busy = true;

    const out = pages[cur];
    const inn = pages[next];

    /* Fade out current */
    out.classList.add('fade-out');
    setTimeout(() => {
      out.classList.remove('active', 'fade-out');

      /* Fade in next */
      inn.classList.add('active', 'fade-in');
      setTimeout(() => {
        inn.classList.remove('fade-in');
        cur = next;
        refresh();
        busy = false;
      }, 360);
    }, 320);
  }

  prevBtn.addEventListener('click', () => go(cur - 1));
  nextBtn.addEventListener('click', () => go(cur + 1));

  /* Keyboard */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   go(cur - 1);
  });

  /* Swipe */
  let sx = 0;
  document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend',   e => {
    const dx = sx - e.changedTouches[0].clientX;
    if (Math.abs(dx) > 40) dx > 0 ? go(cur + 1) : go(cur - 1);
  }, {passive:true});

  /* Mouse wheel */
  let wCool = false;
  document.addEventListener('wheel', e => {
    if (wCool) return; wCool = true;
    e.deltaY > 0 ? go(cur + 1) : go(cur - 1);
    setTimeout(() => wCool = false, 700);
  }, {passive:true});

  refresh();
})();
</script>
</body>
</html>
